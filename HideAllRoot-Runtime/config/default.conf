# HideAllRoot v2.0 默认配置（开发者 MJH）
# 所有开关：1=开启 0=关闭

# 总开关（NEW）
ENABLE=1

# 核心引擎
ENABLE_UNMOUNT=1
ENABLE_ENV_CLEAN=1
ENABLE_ZYGISK_CLEAN=1

# seccomp-bpf 稳妥 PoC（默认关，开启后拦截原始 svc #0 的 openat）
ENABLE_SECCOMP_POC=0

# PLT Hook 防护层
ENABLE_FILE_HIDE=1
ENABLE_PROP_HIDE=1
ENABLE_NATIVE_HOOK=1
ENABLE_APPLIST_HIDE=1
ENABLE_PROC_HIDE=1
ENABLE_ANTIDEBUG=1
ENABLE_PI_FIX=1
ENABLE_MOUNT_HIDE=1
ENABLE_DLADDR_HIDE=1

# 目标模式: 0=全部 1=仅检测工具 2=仅自定义
TARGET_MODE=0

# 检测工具包名（TARGET_MODE=1 时生效）
DETECT_PKGS=com.xtremelabs.momo,com.springroot.ruru,com.chunqiu.check,com.softwinner.firetesting,com.bunny.redtest

# 自定义包名（TARGET_MODE=2 时生效）
CUSTOM_PKGS=
