name: Build Modules

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Build & package both modules
        run: bash build.sh

      - name: Upload Runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: HideAllRoot-Runtime
          path: release/HideAllRoot-Runtime.zip

      - name: Upload System artifact
        uses: actions/upload-artifact@v4
        with:
          name: HideAllRoot-System
          path: release/HideAllRoot-System.zip

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/HideAllRoot-Runtime.zip
            release/HideAllRoot-System.zip
