# HideAllRoot 默认配置（开发者 MJH）
# 所有开关：1=开启 0=关闭
# TARGET_MODE: 0=对所有应用隐藏  1=仅对检测工具隐藏  2=仅对自定义包名隐藏

ENABLE_FILE_HIDE=1
ENABLE_PROP_HIDE=1
ENABLE_NATIVE_HOOK=1
ENABLE_APPLIST_HIDE=1
ENABLE_PROC_HIDE=1
ENABLE_ANTIDEBUG=1
ENABLE_PI_FIX=1
ENABLE_MOUNT_HIDE=1

TARGET_MODE=0

# 已知检测工具包名（TARGET_MODE=1 时生效）
DETECT_PKGS=com.xtremelabs.momo,com.springroot.ruru,com.chunqiu.check,com.softwinner.firetesting,com.bunny.redtest

# 自定义需要隐藏的应用包名（TARGET_MODE=2 时生效，逗号分隔）
CUSTOM_PKGS=
