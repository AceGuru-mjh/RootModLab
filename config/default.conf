# HideAllRoot v2.0 默认配置（开发者 RootModLab）
# 所有开关：1=开启  0=关闭
# TARGET_MODE: 0=对所有应用隐藏  1=仅对检测工具隐藏  2=仅对自定义包名隐藏
#
# 注意：配置修改后，新启动的应用立即生效；已在运行的应用需重启。

ENABLE=1

# ── 各隐藏维度 ───────────────────────────────────────────────
ENABLE_FILE_HIDE=1      # open/openat/openat2/access/stat/readlink
ENABLE_PROP_HIDE=1      # __system_property_get / __system_property_find
ENABLE_PROC_HIDE=1      # readdir 过滤 + connect() + kill() 拦截 + PID 缓存
ENABLE_MAPS_HIDE=1      # /proc/<pid>/maps 行过滤 + 匿名映射重命名防御
ENABLE_MOUNT_HIDE=1     # /proc/mounts 与 /proc/self/mountinfo 过滤
ENABLE_SOCKET_HIDE=1    # /proc/net/unix 守护进程 socket 过滤
ENABLE_DEBUG_HIDE=1     # /proc/self/status TracerPid 清零 + 自 ptrace 拦截
ENABLE_UNMOUNT=1        # VFS 级卸载 Magisk tmpfs / overlay 挂载
ENABLE_ENV_CLEAN=1      # 清理 Zygisk/Magisk/KSU/APatch 环境变量与 PATH
ENABLE_ZYGISK_CLEAN=1   # 激进清理 zygisk/frida/gum/xhook 的 maps 痕迹

# ── 作用范围 ─────────────────────────────────────────────────
TARGET_MODE=0

# 已知检测工具包名（TARGET_MODE=1 时生效，逗号分隔）
TARGET_PKGS=com.xtremelabs.momo,com.springroot.ruru,com.chunqiu.check,com.softwinner.firetesting,com.bunny.redtest

# 自定义需要隐藏的应用包名（TARGET_MODE=2 时生效，逗号分隔）
CUSTOM_PKGS=
